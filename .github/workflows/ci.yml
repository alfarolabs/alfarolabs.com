name: ci

# Authoritative gate. `npm run check` runs the same checks serially on a checkout.
# CI runs typecheck in parallel with build → smoke → smoke:preview for fail-fast.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# Align group with the standard; never cancel a main deploy mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: echo "GATE_START=$(date +%s)" >> "$GITHUB_ENV"
      - id: typecheck
        run: npm run typecheck
      - if: success()
        run: |
          {
            echo "### Gate time"
            echo ""
            echo "typecheck wall time: $(($(date +%s) - GATE_START))s on \`${{ runner.name }}\` (\`${{ runner.os }}\`)."
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: |
          {
            echo "### typecheck failed"
            echo ""
            echo "Command: \`npm run typecheck\`"
            echo "Inspect this job log; fix forward on the branch and re-push."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: echo "GATE_START=$(date +%s)" >> "$GITHUB_ENV"
      - id: build
        run: npm run build
      - id: smoke
        run: npm run smoke
      # Serves dist/ in workerd and checks pages, linked assets, and the 404 over HTTP.
      - id: smoke_preview
        run: npm run smoke:preview
      - if: success()
        run: |
          {
            echo "### Gate time"
            echo ""
            echo "build+smoke wall time: $(($(date +%s) - GATE_START))s on \`${{ runner.name }}\` (\`${{ runner.os }}\`)."
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: |
          {
            echo "### build job failed"
            echo ""
            echo "Ordered gate: \`npm run build\` → \`npm run smoke\` → \`npm run smoke:preview\`"
            echo "(same sequence as \`npm run check\` after typecheck)."
            echo "Smoke is Node HTTP/static checks, not Playwright — no trace artifact."
            echo "Inspect this job log; fix forward on the branch and re-push."
          } >> "$GITHUB_STEP_SUMMARY"
      # The deploy job ships these exact bytes; .wrangler/deploy points wrangler at dist/server.
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            dist
            .wrangler/deploy
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [typecheck, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: failure()
        run: |
          {
            echo "### deploy failed"
            echo ""
            echo "Command: \`npx wrangler deploy\` (artifact from the green build job)."
            echo "Inspect this job log; do not redeploy from a laptop."
          } >> "$GITHUB_STEP_SUMMARY"
